# Trap House production override.
# Usage: COMPOSE_ENV_FILES=.env.hetzner docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Ports and interface bindings come from the base compose plus .env.hetzner
# (host SSH stays on 22, Endlessh tarpit on 22222, deception-gw on 80, Grafana
# and the frontend bound to 127.0.0.1 and reached via SSH tunnel). This file
# only adds hardening that must not be active in dev.

services:
  deception-gw:
    environment:
      # Fail closed: refuse to start in prod if the cookie-signing secret is
      # unset, rather than silently signing sessions with the dev default.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set for production}
      - ENABLE_CANARYTOKENS=${ENABLE_CANARYTOKENS:-false}
      - TRUST_XFF=${TRUST_XFF:-false}
      - CANARY_EMAIL_DOMAIN=${CANARY_EMAIL_DOMAIN:-}
      - PYTHONDONTWRITEBYTECODE=1

  grafana:
    environment:
      # No anonymous access in production; require the admin password.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set for production}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
